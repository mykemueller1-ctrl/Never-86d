name: SEO Audit

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/index.html'
      - 'client/src/pages/**'
  pull_request:
    branches: [main]
    paths:
      - 'client/index.html'
      - 'client/src/pages/**'
  workflow_dispatch:

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    name: SEO Quality Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEO audit
        id: audit
        run: |
          echo "## SEO Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run with verbose output for logs
          python3 scripts/seo_audit.py . --verbose 2>&1 | tee /tmp/seo-audit-output.txt

          # Run JSON for structured data
          python3 scripts/seo_audit.py . --json > /tmp/seo-audit-report.json 2>/dev/null

          # Extract score and findings for summary
          SCORE=$(python3 -c "import json; d=json.load(open('/tmp/seo-audit-report.json')); print(d[0]['score'])")
          FINDINGS=$(python3 -c "import json; d=json.load(open('/tmp/seo-audit-report.json')); print(len(d[0]['findings']))")

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Score | ${SCORE}/100 |" >> $GITHUB_STEP_SUMMARY
          echo "| Findings | ${FINDINGS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FINDINGS" -gt 0 ]; then
            echo "### Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/seo-audit-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All SEO checks passed!**" >> $GITHUB_STEP_SUMMARY
          fi

          # Set output for PR comment
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "findings=$FINDINGS" >> $GITHUB_OUTPUT

      - name: Generate JSON report artifact
        if: failure()
        run: cp /tmp/seo-audit-report.json seo-audit-report.json

      - name: Upload SEO report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit-report.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.audit.outputs.score }}';
            const findings = '${{ steps.audit.outputs.findings }}';
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/seo-audit-output.txt', 'utf8');

            const icon = score >= 90 ? '✅' : score >= 70 ? '⚠️' : '🚨';
            let body = `## ${icon} SEO Audit: ${score}/100\n\n`;

            if (findings === '0') {
              body += '**All SEO checks passed!** No issues found.\n';
            } else {
              body += `**${findings} issue(s) found.**\n\n`;
              body += '<details>\n<summary>View details</summary>\n\n```\n';
              body += output;
              body += '\n```\n</details>\n';
            }

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('SEO Audit:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
