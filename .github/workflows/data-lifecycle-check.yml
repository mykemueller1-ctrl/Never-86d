name: Data Lifecycle Bug Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'drizzle/**'
      - 'shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'drizzle/**'
      - 'shared/**'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  lifecycle-bugs:
    name: Detect Data Lifecycle Bugs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data lifecycle bug detector
        id: detect
        run: |
          echo "::group::Running detector..."
          python3 scripts/detect_lifecycle_bugs.py . --verbose
          echo "::endgroup::"
        continue-on-error: true

      - name: Generate JSON report
        if: steps.detect.outcome == 'failure'
        run: |
          python3 scripts/detect_lifecycle_bugs.py . --json > lifecycle-bugs-report.json
          echo "### :warning: Data Lifecycle Bugs Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Category | File | Line | Message |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('lifecycle-bugs-report.json') as f:
              findings = json.load(f)
          for f in sorted(findings, key=lambda x: {'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}.get(x['severity'],4)):
              sev = f['severity']
              icon = {'CRITICAL':'🔴','HIGH':'🟠','MEDIUM':'🟡','LOW':'⚪'}.get(sev,'⚪')
              msg = f['message'][:60]
              print(f'| {icon} {sev} | {f[\"category\"]} | \`{f[\"file\"]}\` | {f[\"line\"]} | {msg} |')
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total findings:** $(python3 -c 'import json; print(len(json.load(open(\"lifecycle-bugs-report.json\"))))')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run locally: \`python3 scripts/detect_lifecycle_bugs.py . --verbose\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        if: steps.detect.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-bugs-report
          path: lifecycle-bugs-report.json
          retention-days: 30

      - name: Fail on CRITICAL or HIGH findings
        if: steps.detect.outcome == 'failure'
        run: |
          echo "::error::Data lifecycle bugs detected! See the report above or download the artifact."
          echo ""
          python3 scripts/detect_lifecycle_bugs.py . --verbose
          exit 1

  # Optional: Comment on PR with findings
  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: lifecycle-bugs
    if: failure() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate PR comment
        id: comment
        run: |
          python3 scripts/detect_lifecycle_bugs.py . --json > report.json 2>/dev/null || true
          python3 -c "
          import json
          with open('report.json') as f:
              findings = json.load(f)
          critical = [f for f in findings if f['severity'] == 'CRITICAL']
          high = [f for f in findings if f['severity'] == 'HIGH']
          body = '## 🚨 Data Lifecycle Bugs Detected\n\n'
          body += f'**{len(critical)} CRITICAL** | **{len(high)} HIGH** | **{len(findings)} total**\n\n'
          if critical:
              body += '### Critical Issues (app will break)\n\n'
              for f in critical:
                  body += f'- **{f[\"category\"]}** in \`{f[\"file\"]}:{f[\"line\"]}\`\n'
                  body += f'  - {f[\"message\"]}\n'
                  body += f'  - Fix: {f[\"fix\"]}\n\n'
          if high:
              body += '### High Issues (security/reliability)\n\n'
              for f in high[:5]:
                  body += f'- **{f[\"category\"]}** in \`{f[\"file\"]}:{f[\"line\"]}\`\n'
                  body += f'  - {f[\"message\"]}\n'
              if len(high) > 5:
                  body += f'\n*...and {len(high)-5} more HIGH findings*\n'
          body += '\n---\n*Run locally: \`python3 scripts/detect_lifecycle_bugs.py . --verbose\`*'
          # Escape for GitHub Actions
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('comment<<EOF\n')
              out.write(body)
              out.write('\nEOF\n')
          " 

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lifecycle-bugs
          message: ${{ steps.comment.outputs.comment }}
